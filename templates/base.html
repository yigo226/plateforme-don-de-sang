<!DOCTYPE html>
{% load static %}
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Don de Sang{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS personnalisé -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body class="bg-light d-flex flex-column min-vh-100">

<!-- ================= NAVBAR ================= -->
<nav class="navbar navbar-expand-lg navbar-dark bg-danger shadow">
    <div class="container">

        <!-- Logo -->
        <a class="navbar-brand fw-bold" href="/">
            🩸 DonSang
        </a>

        <!-- Bouton mobile -->
        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarContent"
                aria-controls="navbarContent"
                aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Contenu navbar -->
        <div class="collapse navbar-collapse" id="navbarContent">
            <ul class="navbar-nav ms-auto gap-2 mt-3 mt-lg-0">

                <!-- <li class="nav-item">
                    <a href="{% url 'liste_utilisateurs' %}" class="btn btn-light">
                        Utilisateurs
                    </a>
                </li> -->

                {% if user.is_authenticated %}
                    <li class="nav-item">
                        <a href="{% url 'deconnexion' %}" class="btn btn-warning">
                            Se déconnecter
                        </a>
                    </li>
                {% else %}
                    <li class="nav-item">
                        <a href="{% url 'connexion' %}" class="btn btn-info">
                            Se connecter
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="{% url 'inscription' %}" class="btn btn-success">
                            S'inscrire
                        </a>
                    </li>
                {% endif %}

            </ul>
        </div>
    </div>
</nav>

<!-- ================= CONTENU ================= -->
<main class="container my-4 flex-grow-1">
    {% block content %}
    {% endblock %}
</main>

<!-- ================= FOOTER ================= -->
<footer class="bg-success text-white text-center py-3 mt-auto">
    <small>© 2026 DonSang — Plateforme de don de sang</small>
</footer>

<!-- Bootstrap JS (OBLIGATOIRE) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
